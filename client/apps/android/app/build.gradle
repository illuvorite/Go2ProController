def buildAsLibrary = project.hasProperty('BUILD_AS_LIBRARY');
def buildAsApplication = !buildAsLibrary
if (buildAsApplication) {
    apply plugin: 'com.android.application'
}
else {
    apply plugin: 'com.android.library'
}

android {
    if (buildAsApplication) {
        namespace "org.libsdl.app"
    }
    compileSdkVersion 34
    // 锁到项目内已装好的 NDK（install_sdk_manual.py 装的 r26b），避免 AGP 再去下载另一个 NDK
    ndkVersion "26.1.10909125"
    defaultConfig {
        applicationId "com.go2.remote"
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        externalNativeBuild {
            cmake {
                // GO2_ANDROID_DEPS = 预编译依赖前缀（由 build_deps_arm64.ps1 生成）：
                //   lib/{libssl.a,libcrypto.a,libdatachannel.a,libjuice.a,libusrsctp.a}
                //   include/{openssl/,rtc/}
                // 不走 vcpkg：本机没有 Visual Studio，vcpkg 的 arm64-android 构建起不来
                //
                // 路径不写死绝对路径（否则别人 clone 下来必然构建失败）：
                // 优先 -PGO2_ANDROID_DEPS=... / 环境变量 GO2_ANDROID_DEPS，默认用项目内的 _deps_arm64
                def go2Deps = project.findProperty('GO2_ANDROID_DEPS')
                        ?: System.getenv('GO2_ANDROID_DEPS')
                        ?: "${rootProject.projectDir}/_deps_arm64"
                arguments "-DANDROID_STL=c++_shared",
                          "-DGO2_ANDROID_DEPS=${go2Deps}"
                abiFilters 'arm64-v8a'      // 真机；模拟器可加 'x86_64'
            }
            // cmake {
            //     arguments "-DANDROID_APP_PLATFORM=android-19", "-DANDROID_STL=c++_static"
            //     // abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            //     abiFilters 'arm64-v8a'
            // }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
    }
    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }
        externalNativeBuild {
            cmake {
                path 'jni/CMakeLists.txt'
            }
            // cmake {
            //     path 'jni/CMakeLists.txt'
            // }
        }
       
    }
    lint {
        abortOnError false
    }

    if (buildAsLibrary) {
        libraryVariants.all { variant ->
            variant.outputs.each { output ->
                def outputFile = output.outputFile
                if (outputFile != null && outputFile.name.endsWith(".aar")) {
                    def fileName = "org.libsdl.app.aar";
                    output.outputFile = new File(outputFile.parent, fileName);
                }
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
